<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Write</title>
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <style>
    @font-face {
      font-family: 'Geist';
      src: url('../fonts/Geist.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }

    @font-face {
      font-family: 'Geist Mono';
      src: url('../fonts/GeistMono.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --paper: #faf9f6;
      --ink: #292824;
      --muted: #77746d;
      --rule: #e5e2db;
      --key: #8a6d3b;
      --accent: #292824;
      --accent-text: #faf9f6;
      --error: #b3261e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #121213;
        --ink: #deddd8;
        --muted: #9d9b96;
        --rule: #303030;
        --key: #d1b47a;
        --accent: #deddd8;
        --accent-text: #121213;
        --error: #ff8a80;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1rem 4rem;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    h1 { font-size: 14px; font-weight: 600; margin: 0; }

    .tabs { display: flex; gap: 1rem; }

    .link-button {
      font: inherit;
      padding: 0;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    .link-button:hover { color: var(--ink); }

    .tabs button[aria-pressed="true"] {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .top-right {
      margin-left: auto;
      display: flex;
      gap: 1rem;
      align-items: baseline;
    }

    select {
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule);
      padding: 0.2rem 0;
      max-width: 14rem;
    }

    /* One box, like Bear Blog: "key: value" lines, a blank line, then Markdown. */
    textarea {
      display: block;
      width: 100%;
      min-height: 68vh;
      padding: 1.25rem 0;
      border: none;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      line-height: 1.75;
      resize: vertical;
      tab-size: 2;
    }

    textarea:focus-visible { outline: none; border-color: var(--muted); }
    textarea.dragging { border-color: var(--ink); }

    .keys {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      margin: 0.75rem 0 0;
    }

    .keys b { color: var(--key); font-weight: 400; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1.5rem;
    }

    .btn {
      font: inherit;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }

    .btn:hover { opacity: 0.8; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--rule);
    }

    .status { color: var(--muted); }
    .status.error { color: var(--error); }
    .status a { color: var(--ink); }

    #photo-input { display: none; }

    .field label { display: block; color: var(--muted); margin-bottom: 0.4rem; }

    .field input {
      width: 100%;
      font: inherit;
      padding: 0.5rem 0;
      border: none;
      border-bottom: 1px solid var(--rule);
      background: transparent;
      color: var(--ink);
    }

    .hint { color: var(--muted); line-height: 1.6; }
    .hint a { color: var(--ink); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Shown until this browser has a GitHub token -->
  <section id="sign-in" hidden>
    <div class="top"><h1>Write</h1></div>
    <div class="field">
      <label for="token">GitHub token</label>
      <input type="password" id="token" autocomplete="off" spellcheck="false" />
      <p class="hint">
        Publishing commits to your site's repo, so this browser needs a GitHub token.
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Create a fine-grained token</a>
        with access to <b>div-nar/div-nar.github.io</b> only and <b>Contents: Read and write</b>.
        It stays in this browser and is only sent to GitHub.
      </p>
    </div>
    <div class="actions">
      <button id="sign-in-btn" class="btn" type="button">Continue</button>
      <span class="status" id="sign-in-status" role="status"></span>
    </div>
  </section>

  <section id="editor" hidden>
    <div class="top">
      <h1>Write</h1>
      <div class="tabs" role="group" aria-label="Section">
        <button class="link-button" type="button" data-collection="posts" aria-pressed="true">Writing</button>
        <button class="link-button" type="button" data-collection="drinks" aria-pressed="false">Madeera</button>
      </div>
      <div class="top-right">
        <select id="entry-select" aria-label="Open an entry"></select>
        <button id="sign-out" class="link-button" type="button">Sign out</button>
      </div>
    </div>

    <textarea id="text" spellcheck="true" aria-label="Entry" aria-describedby="keys"></textarea>
    <p class="keys" id="keys"></p>

    <div class="actions">
      <button id="publish-btn" class="btn" type="button">Publish</button>
      <button id="preview-btn" class="btn secondary" type="button">Preview</button>
      <label class="btn secondary" for="photo-input">Add photo</label>
      <input type="file" id="photo-input" accept="image/*" />
      <button id="discard-btn" class="link-button" type="button" hidden>Discard changes</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js" integrity="sha384-k8o8HikHweyzW55Wd3wl18ovJj6vHVYNQeQbeSM0fxx+0WiH4TcccOG9uz8Xd2JR" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous"></script>
  <script>
    const REPO = 'div-nar/div-nar.github.io';
    const BRANCH = 'main';
    const API = `https://api.github.com/repos/${REPO}`;
    const RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
    const SITE = 'https://div-nar.github.io';
    const TOKEN_KEY = 'write:token';
    const PHOTO_MAX = 1600;

    // Mirrors `collections` in scripts/build.js. `starter` is the text a new entry opens with.
    const COLLECTIONS = {
      posts: {
        dir: 'posts',
        out: (slug) => `${slug}.html`,
        back: ['index.html', '← Back to writing'],
        starter: () => `title: \ndate: ${today()}\n\n`,
        keys: ['title', 'date', 'photo', 'link', 'draft'],
      },
      drinks: {
        dir: 'drinks',
        out: (slug) => `madeera-${slug}.html`,
        back: ['madeera.html', '← Back to Madeera'],
        starter: () => `title: \ndate: ${today()}\n\n`,
        keys: ['title', 'date', 'photo', 'link', 'draft'],
      },
    };

    const $ = (id) => document.getElementById(id);
    const status = $('status');
    const text = $('text');
    let collection = 'posts';
    let entries = [];       // [{ slug, data, body }] from the repo
    let current = null;     // the repo entry being edited, or null for a new one
    let uploads = {};       // repo path -> data URL for photos not yet committed

    // --- storage (wrapped: private windows can throw) -------------------------

    function store(key, value) {
      try {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function load(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
    }

    // --- helpers --------------------------------------------------------------

    function today() {
      return new Date().toLocaleDateString('en-CA');
    }

    function slugify(title) {
      return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function escapeHtml(s) {
      return String(s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
    }

    function say(html, isError = false) {
      status.classList.toggle('error', isError);
      status.innerHTML = html;
    }

    function parseMarkdownFile(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (!m) return { data: {}, body: text };
      // JSON schema keeps `date: 2026-05-01` a plain string.
      return { data: jsyaml.load(m[1], { schema: jsyaml.JSON_SCHEMA }) || {}, body: m[2].trim() };
    }

    function toMarkdownFile(data, body) {
      return `---\n${jsyaml.dump(data, { lineWidth: -1 })}---\n${body.trim()}\n`;
    }

    // --- the one-box format ---------------------------------------------------

    // The (?!\/\/) keeps a bare link like https://… from reading as a key.
    const HEADER_LINE = /^([A-Za-z][\w-]*):(?!\/\/)[ \t]*(.*)$/;

    // Leading "key: value" lines count as the header only when a blank line
    // (or the end) follows them, so a body that opens with "Note: ..." stays body.
    function splitText(value) {
      const lines = value.replace(/\r\n/g, '\n').split('\n');
      let i = 0;
      while (i < lines.length && HEADER_LINE.test(lines[i])) i++;
      if (i === 0 || (i < lines.length && lines[i].trim() !== '')) return { header: {}, body: value.trim() };

      const header = {};
      for (const line of lines.slice(0, i)) {
        const [, key, val] = line.match(HEADER_LINE);
        if (val.trim()) header[key.toLowerCase()] = val.trim();
      }
      return { header, body: lines.slice(i).join('\n').trim() };
    }

    function joinText(data, body) {
      const lines = Object.entries(data).map(([k, v]) => `${k}: ${v}`);
      return `${lines.join('\n')}\n\n${body}`;
    }

    // Header values -> frontmatter. title and date always come first; any
    // other key is kept as typed.
    function toData(header) {
      const data = { title: header.title || '', date: header.date || '' };
      for (const [key, val] of Object.entries(header)) {
        if (key === 'title' || key === 'date' || key === 'link') continue;
        if (key === 'draft') {
          if (/^(true|yes|1)$/i.test(val)) data.draft = true;
          continue;
        }
        data[key] = val;
      }
      return data;
    }

    function isDraft() {
      return /^(true|yes|1)$/i.test(splitText(text.value).header.draft || '');
    }

    // --- GitHub ---------------------------------------------------------------

    async function gh(path, options = {}) {
      const res = await fetch(path.startsWith('http') ? path : `${API}${path}`, {
        ...options,
        cache: 'no-store',
        headers: {
          Authorization: `Bearer ${load(TOKEN_KEY)}`,
          Accept: options.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        },
      });
      if (res.status === 404 && options.allow404) return null;
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error('GitHub rejected the token. Sign out and paste a new one.');
        throw new Error(`GitHub: ${detail.message || res.statusText}`);
      }
      return options.raw ? res.text() : res.json();
    }

    async function loadEntries() {
      const dir = COLLECTIONS[collection].dir;
      const files = (await gh(`/contents/${dir}?ref=${BRANCH}`, { allow404: true })) || [];
      const mds = files.filter((f) => f.name.endsWith('.md') && f.name !== 'EXAMPLE.md');
      entries = await Promise.all(mds.map(async (f) => {
        const text = await gh(`/contents/${f.path}?ref=${BRANCH}`, { raw: true });
        return { slug: f.name.slice(0, -3), ...parseMarkdownFile(text) };
      }));
      entries.sort((a, b) => String(b.data.date).localeCompare(String(a.data.date)));
    }

    // One commit with the Markdown file plus any new photos.
    async function commit(message, files) {
      const ref = await gh(`/git/ref/heads/${BRANCH}`);
      const head = await gh(`/git/commits/${ref.object.sha}`);
      const tree = await Promise.all(files.map(async (f) => {
        const entry = { path: f.path, mode: '100644', type: 'blob' };
        if (f.base64) {
          const blob = await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content: f.base64, encoding: 'base64' }) });
          return { ...entry, sha: blob.sha };
        }
        return { ...entry, content: f.content };
      }));
      const newTree = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
      const newCommit = await gh('/git/commits', {
        method: 'POST',
        body: JSON.stringify({ message, tree: newTree.sha, parents: [ref.object.sha] }),
      });
      await gh(`/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: newCommit.sha }) });
    }

    // --- photos ---------------------------------------------------------------

    // Shrinks phone photos to at most PHOTO_MAX px on the long side, as JPEG.
    async function shrink(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, PHOTO_MAX / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    function photoPath() {
      const stamp = new Date().toISOString().replace(/\D/g, '').slice(0, 14);
      return `images/${COLLECTIONS[collection].dir}/${stamp}.jpg`;
    }

    // Photos not yet committed preview from memory; committed ones from the repo.
    function photoSrc(path) {
      return uploads[path] || `${RAW}/${path}`;
    }

    // "Add photo" fills the photo: line (the photo beside the entry).
    function setPhotoLine(path) {
      const value = text.value;
      const { header } = splitText(value);
      if (!Object.keys(header).length) {
        text.value = `photo: ${path}\n\n${value}`;
      } else if (/^photo:.*$/m.test(value.split(/\n\s*\n/)[0])) {
        text.value = value.replace(/^photo:.*$/m, `photo: ${path}`);
      } else {
        const end = value.search(/\n\s*\n/);
        text.value = `${value.slice(0, end)}\nphoto: ${path}${value.slice(end)}`;
      }
    }

    // Pasting or dropping a photo puts it inline at the cursor, Bear Blog style.
    function insertAtCursor(snippet) {
      const { selectionStart: start, selectionEnd: end, value } = text;
      text.value = value.slice(0, start) + snippet + value.slice(end);
      text.selectionStart = text.selectionEnd = start + snippet.length;
      text.focus();
    }

    function addPhoto(file, place) {
      return run('Preparing photo…', async () => {
        let dataUrl;
        try {
          dataUrl = await shrink(file);
        } catch {
          throw new Error("This browser can't read that photo. Try a JPEG or PNG.");
        }
        const path = photoPath();
        uploads[path] = dataUrl;
        place(path);
        saveDraft();
        say('');
      });
    }

    // --- editor state and local drafts ----------------------------------------

    function draftKey() {
      return `write:draft:${collection}:${current ? current.slug : 'new'}`;
    }

    function saveDraft() {
      store(draftKey(), { text: text.value, uploads });
      $('discard-btn').hidden = false;
      updatePublishLabel();
    }

    function updatePublishLabel() {
      $('publish-btn').textContent = isDraft() ? 'Save draft' : 'Publish';
    }

    function openEntry(entry) {
      current = entry;
      const draft = load(draftKey());
      uploads = draft?.uploads || {};
      text.value = draft ? draft.text
        : entry ? joinText(entry.data, entry.body)
        : COLLECTIONS[collection].starter();
      $('discard-btn').hidden = !draft;
      $('entry-select').value = entry ? entry.slug : '';
      updatePublishLabel();
      say(draft ? 'Restored your unsaved changes.' : entry ? (entry.data.draft ? 'Draft, not on the site' : 'Published') : '');
      if (!entry && !draft) {
        // Cursor after "title: ".
        text.focus();
        text.selectionStart = text.selectionEnd = 'title: '.length;
      }
    }

    function renderSelect() {
      $('entry-select').innerHTML = '<option value="">New entry</option>' +
        entries.map((e) => `<option value="${e.slug}">${escapeHtml(e.data.title || e.slug)}${e.data.draft ? ' (draft)' : ''}</option>`).join('');
    }

    function renderKeys() {
      const keys = COLLECTIONS[collection].keys.map((k) => `<b>${k}:</b>`).join(' ');
      $('keys').innerHTML = `${keys} · title and date are required, the rest optional, add any of your own · blank line, then Markdown · paste or drop a photo to put it inline`;
    }

    async function switchTo(next) {
      collection = next;
      for (const b of document.querySelectorAll('.tabs button')) {
        b.setAttribute('aria-pressed', String(b.dataset.collection === next));
      }
      renderKeys();
      await run('Loading…', async () => {
        await loadEntries();
        renderSelect();
        openEntry(null);
      });
    }

    async function run(label, task) {
      const buttons = document.querySelectorAll('#editor button');
      for (const b of buttons) b.disabled = true;
      say(label);
      try {
        await task();
      } catch (err) {
        say(escapeHtml(err.message), true);
      } finally {
        for (const b of buttons) b.disabled = false;
      }
    }

    // Everything publish and preview need, read from the box.
    function readEntry() {
      const { header, body } = splitText(text.value);
      const data = toData(header);
      return { header, title: data.title, body, data };
    }

    // --- preview and publish --------------------------------------------------

    // Approximates scripts/build.js renderPage in the browser.
    async function preview(tab) {
      const { title, body, data } = readEntry();
      const c = COLLECTIONS[collection];
      const template = await (await fetch('../templates/post.html', { cache: 'no-store' })).text();
      const date = new Date(data.date);
      // Inline photos not yet committed show from memory.
      let html = marked.parse(body);
      for (const [path, dataUrl] of Object.entries(uploads)) html = html.replaceAll(path, dataUrl);
      const page = template
        .replace('<head>', `<head>\n  <base href="${new URL('..', location.href)}" />`)
        .replaceAll('{{title}}', escapeHtml(title || 'Untitled'))
        .replaceAll('{{displayDate}}', isNaN(date) ? escapeHtml(data.date) : date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' }))
        .replaceAll('{{isoDate}}', escapeHtml(data.date))
        .replace('{{mainClass}}', data.photo ? ' class="has-photo"' : '')
        .replace('{{photo}}', data.photo ? `<figure class="entry-photo"><img src="${photoSrc(data.photo)}" alt="" /></figure>\n    ` : '')
        .replace('{{backHref}}', c.back[0])
        .replace('{{backLabel}}', c.back[1])
        .replace('{{body}}', html);
      tab.document.open();
      tab.document.write(page);
      tab.document.close();
    }

    async function publish() {
      const { header, title, body, data } = readEntry();
      if (!title) throw new Error('Every entry needs a title: line');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(data.date) || isNaN(new Date(data.date))) {
        throw new Error(`Every entry needs a date: line like ${today()}`);
      }

      const c = COLLECTIONS[collection];
      // link: picks the URL of a new entry; an existing entry keeps its URL.
      let slug = current ? current.slug : slugify(header.link || title);
      if (!slug) throw new Error('The title needs at least one letter or number for its URL. Add a link: line.');
      if (!current) {
        const base = slug;
        for (let n = 2; entries.some((e) => e.slug === slug); n++) slug = `${base}-${n}`;
      }

      // Commit only the photos the entry still uses.
      const used = Object.keys(uploads).filter((p) => data.photo === p || body.includes(p));
      const files = used.map((p) => ({ path: p, base64: uploads[p].split(',')[1] }));
      files.push({ path: `${c.dir}/${slug}.md`, content: toMarkdownFile(data, body) });

      const verb = data.draft ? 'Draft' : current ? 'Update' : 'Publish';
      await commit(`${verb}: ${title}`, files);

      store(draftKey(), null);
      uploads = {};
      await loadEntries();
      renderSelect();
      openEntry(entries.find((e) => e.slug === slug) || null);
      if (data.draft) {
        say('Saved as a draft. It stays off the site until you remove the draft: line.');
      } else {
        const url = `${SITE}/${c.out(slug)}`;
        say(`Published. The site rebuilds in a minute or two: <a href="${url}" target="_blank" rel="noopener">${url.replace('https://', '')}</a>`);
      }
    }

    // --- wiring ---------------------------------------------------------------

    $('entry-select').addEventListener('change', () => {
      openEntry(entries.find((e) => e.slug === $('entry-select').value) || null);
    });

    for (const b of document.querySelectorAll('.tabs button')) {
      b.addEventListener('click', () => switchTo(b.dataset.collection));
    }

    text.addEventListener('input', saveDraft);

    $('photo-input').addEventListener('change', () => {
      const file = $('photo-input').files[0];
      $('photo-input').value = '';
      if (file) addPhoto(file, setPhotoLine);
    });

    text.addEventListener('paste', (e) => {
      const file = [...e.clipboardData.files].find((f) => f.type.startsWith('image/'));
      if (!file) return;
      e.preventDefault();
      addPhoto(file, (path) => insertAtCursor(`![](${path})`));
    });

    text.addEventListener('dragover', (e) => {
      if (![...e.dataTransfer.types].includes('Files')) return;
      e.preventDefault();
      text.classList.add('dragging');
    });
    text.addEventListener('dragleave', () => text.classList.remove('dragging'));
    text.addEventListener('drop', (e) => {
      text.classList.remove('dragging');
      const file = [...e.dataTransfer.files].find((f) => f.type.startsWith('image/'));
      if (!file) return;
      e.preventDefault();
      addPhoto(file, (path) => insertAtCursor(`\n![](${path})\n`));
    });

    // Cmd/Ctrl+S saves (publishes, or saves the draft).
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 's' && !$('editor').hidden) {
        e.preventDefault();
        $('publish-btn').click();
      }
    });

    $('discard-btn').addEventListener('click', () => {
      store(draftKey(), null);
      openEntry(current);
    });

    $('preview-btn').addEventListener('click', () => {
      // Open the tab now so the browser doesn't treat it as a popup.
      const tab = window.open('', '_blank');
      preview(tab).catch((err) => { tab.close(); say(escapeHtml(err.message), true); });
    });

    $('publish-btn').addEventListener('click', () => {
      const { title, data } = readEntry();
      const question = data.draft
        ? `Save "${title || 'Untitled'}" as a draft?`
        : `Publish "${title || 'Untitled'}" to div-nar.github.io?`;
      if (!confirm(question)) return;
      run(data.draft ? 'Saving…' : 'Publishing…', publish);
    });

    $('sign-out').addEventListener('click', () => {
      store(TOKEN_KEY, null);
      location.reload();
    });

    $('sign-in-btn').addEventListener('click', async () => {
      const token = $('token').value.trim();
      const out = $('sign-in-status');
      out.classList.remove('error');
      out.textContent = 'Checking…';
      store(TOKEN_KEY, token);
      try {
        const repo = await gh('');
        if (!repo.permissions?.push) throw new Error("This token can read the repo but can't write to it. Give it Contents: Read and write.");
        start();
      } catch (err) {
        store(TOKEN_KEY, null);
        out.classList.add('error');
        out.textContent = err.message;
      }
    });

    function start() {
      $('sign-in').hidden = true;
      $('editor').hidden = false;
      switchTo('posts');
    }

    // Demo mode for trying the editor locally: sample entries, no GitHub calls.
    const DEMO = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).has('demo');
    if (DEMO) {
      const sample = {
        posts: [
          { slug: 'i-need-not', data: { title: 'I Need Not', date: '2026-05-01' }, body: 'I need not of approval, for why must my craft be tied to a score?' },
        ],
        drinks: [
          { slug: 'amrut-fusion', data: { title: 'Amrut Fusion', date: '2026-09-02' }, body: 'Peat, then dark chocolate.' },
        ],
      };
      loadEntries = async () => { entries = [...sample[collection]]; };
      commit = async (message, files) => {
        const md = files.find((f) => f.path.endsWith('.md'));
        const slug = md.path.split('/').pop().slice(0, -3);
        const list = sample[collection].filter((e) => e.slug !== slug);
        list.push({ slug, ...parseMarkdownFile(md.content) });
        sample[collection] = list;
        window.lastCommit = { message, files };
        console.log('[demo] would commit:', message, files.map((f) => f.path));
      };
      document.title = 'Write (demo)';
      start();
    } else if (load(TOKEN_KEY)) start();
    else $('sign-in').hidden = false;
  </script>
</body>
</html>
