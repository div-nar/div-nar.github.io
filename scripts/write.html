<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Write — Divith Narendra</title>
  <style>
    :root {
      --bg: #faf9f6;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #ddd;
      --accent: #1a1a1a;
      --accent-text: #ffffff;
      --error: #b3261e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171a;
        --text: #f2f1ee;
        --muted: #9a9a9a;
        --border: #333538;
        --accent: #f2f1ee;
        --accent-text: #15171a;
        --error: #ff8a80;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 1rem 6rem;
      color: var(--text);
      background: var(--bg);
    }

    .top {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }

    .tabs { display: flex; gap: 1rem; }

    .tabs button {
      font: inherit;
      font-size: 0.9rem;
      padding: 0;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    .tabs button[aria-pressed="true"] {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .row {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .row > div { flex: 1; min-width: 0; }

    @media (max-width: 560px) {
      .row { flex-direction: column; gap: 1.5rem; }
    }

    select, input, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5rem 0;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--text);
    }

    select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: none;
      border-color: var(--text);
    }

    textarea {
      min-height: 52vh;
      line-height: 1.7;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92rem;
      padding: 0.75rem 0;
    }

    .field { margin-bottom: 1.5rem; }
    .hint { font-size: 0.8rem; color: var(--muted); margin: 0.5rem 0 0; }

    button.btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.7rem 1.4rem;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }

    button.btn:hover { opacity: 0.8; }
    button.btn:disabled { opacity: 0.4; cursor: default; }

    button.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 2rem;
    }

    .status { font-size: 0.85rem; color: var(--muted); }
    .status.error { color: var(--error); }
    .status a { color: var(--text); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Write</h1>
    <div class="tabs" role="group" aria-label="Section">
      <button type="button" data-collection="posts" aria-pressed="true">Writing</button>
      <button type="button" data-collection="drinks" aria-pressed="false">Off the Keg</button>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="entry-select">Entry</label>
      <select id="entry-select"></select>
    </div>
    <div>
      <label for="date">Date</label>
      <input type="date" id="date" />
    </div>
  </div>

  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" />
  </div>

  <div id="drink-fields" hidden>
    <div class="row">
      <div>
        <label for="category">Category</label>
        <select id="category">
          <option value="Spirits">Spirits</option>
          <option value="Wines">Wines</option>
          <option value="Beers">Beers</option>
        </select>
      </div>
      <div>
        <label for="maker">Maker</label>
        <input type="text" id="maker" placeholder="Amrut Distilleries" />
      </div>
    </div>
    <div class="row">
      <div>
        <label for="where">Where</label>
        <input type="text" id="where" placeholder="Toit, Bengaluru" />
      </div>
      <div>
        <label for="rating">Rating</label>
        <input type="text" id="rating" placeholder="4/5" />
      </div>
    </div>
  </div>

  <div class="field">
    <label for="body">Body (Markdown)</label>
    <textarea id="body" placeholder="Write here…"></textarea>
    <p class="hint">Blank line between paragraphs. **bold**, *italic*, [link](https://…), ## subheading. ⌘S saves. New entries stay private drafts until you publish.</p>
  </div>

  <div class="actions">
    <button id="new-btn" class="btn secondary" type="button">New</button>
    <button id="draft-btn" class="btn secondary" type="button">Save</button>
    <button id="preview-btn" class="btn secondary" type="button">Preview</button>
    <button id="publish-btn" class="btn" type="button">Publish</button>
    <span class="status" id="status" role="status"></span>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const select = $('entry-select');
    const status = $('status');
    const fields = ['title', 'date', 'category', 'maker', 'where', 'rating', 'body'];
    let collection = 'posts';
    let currentSlug = null;
    // Saving a published entry keeps it published; only new entries are drafts.
    let isPublished = false;

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function escapeHtml(s) {
      return s.replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
    }

    function say(html, isError = false) {
      status.classList.toggle('error', isError);
      status.innerHTML = html;
    }

    function resetForm() {
      currentSlug = null;
      isPublished = false;
      select.value = '';
      for (const f of fields) $(f).value = '';
      $('date').value = today();
      $('category').value = 'Spirits';
      say('');
    }

    async function api(path, options) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      return data;
    }

    async function loadEntries() {
      const entries = await api(`/api/${collection}`);
      select.innerHTML = '<option value="">New entry</option>' +
        entries.map((e) => `<option value="${e.slug}">${escapeHtml(e.title)}${e.draft ? ' (draft)' : ''}</option>`).join('');
      select.value = currentSlug || '';
    }

    async function loadEntry(slug) {
      const entry = await api(`/api/${collection}/${slug}`);
      currentSlug = entry.slug;
      isPublished = !entry.draft;
      for (const f of fields) $(f).value = entry[f] || '';
      if (!entry.category) $('category').value = 'Spirits';
      say(entry.draft ? 'Draft' : 'Published');
    }

    async function switchTo(next) {
      collection = next;
      for (const b of document.querySelectorAll('.tabs button')) {
        b.setAttribute('aria-pressed', String(b.dataset.collection === next));
      }
      $('drink-fields').hidden = next !== 'drinks';
      $('title').placeholder = next === 'drinks' ? 'Amrut Fusion' : 'Post title';
      resetForm();
      await loadEntries();
    }

    async function save(publish) {
      const payload = { slug: currentSlug, draft: !(publish || isPublished) };
      for (const f of fields) payload[f] = $(f).value;
      const data = await api(`/api/${collection}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      currentSlug = data.slug;
      await loadEntries();
    }

    async function run(label, task) {
      for (const b of document.querySelectorAll('.actions button')) b.disabled = true;
      say(label);
      try {
        await task();
      } catch (err) {
        say(escapeHtml(err.message), true);
      } finally {
        for (const b of document.querySelectorAll('.actions button')) b.disabled = false;
      }
    }

    const saveDraft = () => run('Saving…', async () => {
      await save(false);
      say(isPublished ? 'Saved. Publish to update the live site.' : 'Draft saved. Only you can see it.');
    });

    select.addEventListener('change', () => {
      if (select.value) run('Loading…', () => loadEntry(select.value));
      else resetForm();
    });

    for (const b of document.querySelectorAll('.tabs button')) {
      b.addEventListener('click', () => switchTo(b.dataset.collection));
    }

    $('new-btn').addEventListener('click', resetForm);
    $('draft-btn').addEventListener('click', saveDraft);

    $('preview-btn').addEventListener('click', () => {
      // Open the tab now so the browser doesn't treat it as a popup.
      const tab = window.open('about:blank', '_blank');
      run('Saving…', async () => {
        await save(false);
        tab.location = `/preview/${collection}/${currentSlug}`;
        say('Saved. Preview opened in a new tab.');
      }).catch(() => tab.close());
    });

    $('publish-btn').addEventListener('click', () => {
      if (!confirm(`Publish "${$('title').value}" to div-nar.github.io?`)) return;
      run('Publishing…', async () => {
        await save(true);
        isPublished = true;
        const data = await api('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ collection, slug: currentSlug }),
        });
        say(data.liveUrl
          ? `Published. Live in a minute or two at <a href="${data.liveUrl}" target="_blank">${data.liveUrl.replace('https://', '')}</a>`
          : escapeHtml(data.message));
      });
    });

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        saveDraft();
      }
    });

    switchTo('posts');
  </script>
</body>
</html>
